<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول الأدمن</title><link rel="stylesheet" href="/styles.css"><style>.login{min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(430px,100%);background:var(--card);border:1px solid var(--border);border-radius:25px;padding:35px;box-shadow:var(--shadow)}.box input{width:100%;padding:13px;margin:7px 0 17px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}.err{color:#a84c4c;margin-bottom:10px}</style></head><body><div class="login"><form class="box" id="f"><div class="logo" style="margin:0 0 30px"><span>مذكرتي</span><small>لوحة المالك</small></div><label>اسم المستخدم<input id="u" required autocomplete="username"></label><label>كلمة المرور<input id="p" type="password" required autocomplete="current-password"></label><div class="err" id="e"></div><button class="btn primary" style="width:100%">دخول</button></form></div><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});if(r.ok)location='/admin/';else document.getElementById('e').textContent='بيانات الدخول غير صحيحة'}</script></body></html>
